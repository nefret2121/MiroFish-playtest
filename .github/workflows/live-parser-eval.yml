name: Live Parser Gold-Set Evaluation

on:
  workflow_dispatch:

jobs:
  live-parser-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require configured model secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
        run: |
          test -n "$LLM_API_KEY" || (echo "Missing LLM_API_KEY" && exit 2)
          test -n "$LLM_BASE_URL" || (echo "Missing LLM_BASE_URL" && exit 2)
          test -n "$LLM_MODEL_NAME" || (echo "Missing LLM_MODEL_NAME" && exit 2)

      - name: Run live Turkish gold-set
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
        run: |
          python -m playtest_lab.gold_set_eval --mode live --out playtest_lab/live-parser-report.json
          cat playtest_lab/live-parser-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: live-parser-report
          path: playtest_lab/live-parser-report.json
